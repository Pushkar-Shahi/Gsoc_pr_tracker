<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080c14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IssueToPR" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Issue to PR | Open-Source Discovery & Solution Blueprints</title>
    <meta name="description" content="Find unclaimed open-source issues with zero active PRs across 1,840+ repositories. Get step-by-step architectural blueprints and file-level guidance to learn, code, and contribute with confidence." />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gsoc-pr-tracker.onrender.com/" />
    <meta property="og:title" content="Issue to PR | Open-Source Discovery & Solution Blueprints" />
    <meta property="og:description" content="Find unclaimed open-source issues with zero active PRs across 1,840+ repositories. Get step-by-step architectural blueprints to learn, code, and contribute." />
    <meta property="og:image" content="https://gsoc-pr-tracker.onrender.com/icons/icon-512.png" />
    <meta property="og:site_name" content="Issue to PR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://gsoc-pr-tracker.onrender.com/" />
    <meta name="twitter:title" content="Issue to PR | Open-Source Discovery & Solution Blueprints" />
    <meta name="twitter:description" content="Find unclaimed open-source issues with zero active PRs across 1,840+ repositories. Get architectural blueprints to learn and contribute." />
    <meta name="twitter:image" content="https://gsoc-pr-tracker.onrender.com/icons/icon-512.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#080c14';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#edf2f7';
            document.documentElement.style.colorScheme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#edf2f7');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Identity Services (GIS) for Google Sign-In & One Tap -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
